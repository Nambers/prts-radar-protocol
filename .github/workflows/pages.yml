name: Deploy Web Bluetooth client to Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/web/**'
      - 'client/server/protocol.py'
      - 'client/server/export_catalog.py'
      - 'client/server/profiles/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export command catalog
        run: python3 client/server/export_catalog.py
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/web/pnpm-lock.yaml
      - name: Build (Web Bluetooth variant)
        working-directory: client/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:webble
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
